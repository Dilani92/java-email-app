<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Template</title>
    <style>
        body, table, td, a {
            font-family: Arial, sans-serif;
            text-size-adjust: 100%;
            line-height: 1.4;
        }
        table {
            border-spacing: 0;
        }
        img {
            border: 0;
            outline: none;
            text-decoration: none;
        }
        .email-wrapper {
            width: 100%;
            background-color: #f4f4f4;
            padding: 20px 0;
        }
        .email-content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
        }
        .email-header {
            text-align: center;
            padding-bottom: 10px;
        }
        .email-header img {
            max-width: 100px;
        }
        .email-body {
            padding: 20px;
            text-align: center;
        }
        .email-footer {
            text-align: center;
            font-size: 12px;
            color: #777777;
            padding-top: 10px;
        }
        .button {
            display: inline-block;
            padding: 12px 20px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="email-content">
        <!-- Email Header -->
        <div class="email-header">
            <img src="C://Users//CHATHURANGA//Desktop//logo.png" alt="Company Logo">
        </div>

        <!-- Email Body -->
        <div class="email-body">
            <h1>Welcome to Our Service!</h1>
            <p>We are excited to have you on board. Please click the button below to get started:</p>
            <a href="https://www.example.com" class="button">Get Started</a>
        </div>

        <!-- Email Footer -->
        <div class="email-footer">
            <p>If you have any questions, feel free to <a href="mailto:support@example.com">contact us</a>.</p>
            <p>&copy; 2025 Company Name. All rights reserved.</p>
        </div>
    </div>
</div>
</body>
</html>
